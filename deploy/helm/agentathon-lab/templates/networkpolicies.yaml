{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS + egress HTTPS vers l'endpoint modèle (CIDR à restreindre).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-model-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: {{ .Values.networkPolicy.modelEgressCIDR | quote }} }
      ports:
        - { protocol: TCP, port: 443 }
---
# Ingress vers le runtime depuis le namespace du contrôleur Gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: lab-runtime }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayControllerNamespaceSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.runtime.port }} }
---
# Maillage intra-MCP : runtime <-> serveurs MCP, ports MCP uniquement, intra-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-mcp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        {{- range .Values.mcp.servers }}
        - { protocol: TCP, port: {{ .port }} }
        {{- end }}
  egress:
    - to:
        - podSelector: {}
      ports:
        {{- range .Values.mcp.servers }}
        - { protocol: TCP, port: {{ .port }} }
        {{- end }}
{{- if eq .Values.dataPlane "real" }}
---
# dataPlane=real : egress des serveurs MCP vers les VRAIES bases (Postgres/Arango/Qdrant).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { agentathon/mcp: "true" }
  policyTypes: [Egress]
  egress:
    {{- range .Values.networkPolicy.backendsEgress }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
