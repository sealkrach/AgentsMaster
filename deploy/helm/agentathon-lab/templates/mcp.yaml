{{- $real := eq .Values.dataPlane "real" -}}
{{- $module := ternary .Values.mcp.realModule .Values.mcp.mockModule $real -}}
{{- $img := .Values.mcp.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) -}}
{{- range .Values.mcp.servers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lab.labels" $ | nindent 4 }}
    app: mcp-{{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-{{ .name }} }
  template:
    metadata:
      labels:
        app: mcp-{{ .name }}
        agentathon/mcp: "true"
        {{- include "lab.labels" $ | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: {{ $.Values.securityContext.runAsNonRoot }}
        runAsUser: {{ $.Values.securityContext.runAsUser }}
        runAsGroup: {{ $.Values.securityContext.runAsGroup }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: "{{ $img }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # mock -> python -m mcp_servers <name> | real -> python -m idp_mcp <name>
          command: ["python", "-m", {{ $module | quote }}, {{ .name | quote }}]
          {{- if $real }}
          # Connexions aux vraies bases (DSN PG read-only, Arango/Qdrant, embedding).
          envFrom:
            - secretRef: { name: {{ $.Values.mcp.backendSecret }} }
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: {{ .port }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml $.Values.mcp.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lab.labels" $ | nindent 4 }}
    app: mcp-{{ .name }}
spec:
  selector: { app: mcp-{{ .name }} }
  ports:
    - { port: {{ .port }}, targetPort: {{ .port }}, name: mcp }
{{- end }}
