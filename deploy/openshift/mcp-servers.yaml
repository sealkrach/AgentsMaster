# Les 4 serveurs MCP, dans le namespace d'une équipe. Via envsubst. Variables : $NS, $IMAGE
# Même image que le runtime, commande différente (python -m mcp_servers <name>).
# Le runtime les joint par DNS interne : http://mcp-<name>.$NS.svc:910x/mcp
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-documents, namespace: "${NS}", labels: { app: mcp-documents } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-documents } }
  template:
    metadata: { labels: { app: mcp-documents } }
    spec:
      containers:
        - name: mcp
          image: ${IMAGE}
          command: ["python", "-m", "mcp_servers", "documents"]
          env: [{ name: MCP_HOST, value: "0.0.0.0" }]
          ports: [{ containerPort: 9101 }]
---
apiVersion: v1
kind: Service
metadata: { name: mcp-documents, namespace: "${NS}" }
spec:
  selector: { app: mcp-documents }
  ports: [{ port: 9101, targetPort: 9101 }]
---
