[alembic]
script_location = alembic
prepend_sys_path = .

# Format: postgresql://user:pass@host/db  (SYNC — psycopg2)
# Remplacé dynamiquement par env.py via DATABASE_URL
sqlalchemy.url = postgresql://lab:lab@localhost:5432/agentathon

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
